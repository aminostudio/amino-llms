name: PHP quality checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax (legacy)
        run: php -l plugin/amino-llms-dynamic/amino-llms-dynamic.php
      - name: PHP syntax (portable beta)
        run: php -l plugin/amino-llms/amino-llms.php
      - name: PHP syntax (tests)
        run: php -l tests/run.php && php -l tests/portable.php
      - name: Legacy tests
        run: php tests/run.php
      - name: Portable engine tests
        run: php tests/portable.php
