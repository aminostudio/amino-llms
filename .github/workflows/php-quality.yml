name: PHP quality checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax (all tracked PHP sources and tests)
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            php -l "$file"
            count=$((count + 1))
          done < <(git ls-files -z '*.php')
          if [ "$count" -eq 0 ]; then
            echo "No tracked PHP files found" >&2
            exit 1
          fi
          echo "Linted $count tracked PHP files with PHP ${{ matrix.php }}"
      - name: WordPress.org metadata consistency
        run: php tests/release-metadata.php
      - name: Legacy tests
        run: php tests/run.php
      - name: Portable engine tests
        run: php tests/portable.php
