name: PHP quality checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        run: php -l plugin/amino-llms-dynamic/amino-llms-dynamic.php
      - name: Local WordPress-function mocks
        run: php tests/run.php
