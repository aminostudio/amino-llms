name: Build installable WordPress ZIP
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check source layout and PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          php -l plugin/llms-txt-composer/llms-txt-composer.php
          test -s plugin/llms-txt-composer/readme.txt
          test -s plugin/llms-txt-composer/uninstall.php
          test -s plugin/llms-txt-composer/assets/admin.css
          test -s plugin/llms-txt-composer/assets/admin.js
          node --check plugin/llms-txt-composer/assets/admin.js
          test -f LICENSE
      - name: Build minimal installable plugin archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/llms-txt-composer
          cp plugin/llms-txt-composer/llms-txt-composer.php plugin/llms-txt-composer/readme.txt plugin/llms-txt-composer/uninstall.php dist/llms-txt-composer/
          cp -R plugin/llms-txt-composer/assets dist/llms-txt-composer/
          cp LICENSE dist/llms-txt-composer/LICENSE
          (cd dist && zip -qr llms-txt-composer-1.2.1.zip llms-txt-composer)
          unzip -l dist/llms-txt-composer-1.2.1.zip
          test "$(unzip -Z1 dist/llms-txt-composer-1.2.1.zip | grep -c 'llms-txt-composer/llms-txt-composer.php')" -eq 1
          ! unzip -Z1 dist/llms-txt-composer-1.2.1.zip | grep -Eq '(^|/)(tests|\.github|vendor|node_modules)/'
          sha256sum dist/llms-txt-composer-1.2.1.zip > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: llms-txt-composer-installable-v1.2.1
          path: |
            dist/llms-txt-composer-1.2.1.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: Publish testable GitHub prerelease
    # Release publishing stays manually gated during slug migration.
    if: false
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: llms-txt-composer-installable-v1.2.1
          path: dist
      - name: Publish installable ZIP and checksum
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.2.1 >/dev/null 2>&1; then
            echo "GitHub release v1.2.1 already exists; leaving it unchanged."
            exit 0
          fi
          sha256sum -c dist/SHA256SUMS.txt
          gh release create v1.2.1 dist/llms-txt-composer-1.2.1.zip dist/SHA256SUMS.txt \
            --title 'LLMs.txt Composer v1.2.1' \
            --notes-file docs/release-notes-v1.2.1.md \
            --prerelease
