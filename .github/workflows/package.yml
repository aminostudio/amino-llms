name: Build installable WordPress ZIP
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate plugin header and stable release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(awk '/^[[:space:]]+\* Version:/{print $3; exit}' plugin/llms-txt-composer/llms-txt-composer.php)"
          STABLE="$(awk '/^Stable tag:/{print $3; exit}' plugin/llms-txt-composer/readme.txt)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ || "$VERSION" != "$STABLE" ]]; then
            echo "Version header and readme Stable tag must match and be semver-like" >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Check source layout and PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          php -l plugin/llms-txt-composer/llms-txt-composer.php
          test -s plugin/llms-txt-composer/readme.txt
          test -s plugin/llms-txt-composer/uninstall.php
          test -s plugin/llms-txt-composer/assets/admin.css
          test -s plugin/llms-txt-composer/assets/admin.js
          node --check plugin/llms-txt-composer/assets/admin.js
          test -f LICENSE
      - name: Build minimal installable plugin archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/llms-txt-composer
          cp plugin/llms-txt-composer/llms-txt-composer.php plugin/llms-txt-composer/readme.txt plugin/llms-txt-composer/uninstall.php dist/llms-txt-composer/
          cp -R plugin/llms-txt-composer/assets dist/llms-txt-composer/
          cp LICENSE dist/llms-txt-composer/LICENSE
          (cd dist && zip -qr llms-txt-composer-${{ steps.version.outputs.value }}.zip llms-txt-composer)
          unzip -l dist/llms-txt-composer-${{ steps.version.outputs.value }}.zip
          unzip -t "dist/llms-txt-composer-${{ steps.version.outputs.value }}.zip"
          test "$(unzip -Z1 dist/llms-txt-composer-${{ steps.version.outputs.value }}.zip | grep -c 'llms-txt-composer/llms-txt-composer.php')" -eq 1
          ! unzip -Z1 dist/llms-txt-composer-${{ steps.version.outputs.value }}.zip | grep -Eq '(^|/)(tests|\.github|vendor|node_modules)/'
          sha256sum dist/llms-txt-composer-${{ steps.version.outputs.value }}.zip > dist/SHA256SUMS.txt
          sha256sum -c dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: llms-txt-composer-installable-v${{ steps.version.outputs.value }}
          path: |
            dist/llms-txt-composer-${{ steps.version.outputs.value }}.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: Publish testable GitHub prerelease
    # Release publishing stays manually gated during slug migration.
    if: false
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: llms-txt-composer-installable-v${{ needs.package.outputs.version }}
          path: dist
      - name: Publish installable ZIP and checksum
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v${{ needs.package.outputs.version }} >/dev/null 2>&1; then
            echo "GitHub release v${{ needs.package.outputs.version }} already exists; leaving it unchanged."
            exit 0
          fi
          sha256sum -c dist/SHA256SUMS.txt
          gh release create v${{ needs.package.outputs.version }} dist/llms-txt-composer-${{ needs.package.outputs.version }}.zip dist/SHA256SUMS.txt \
            --title 'LLMs.txt Composer v${{ needs.package.outputs.version }}' \
            --notes-file docs/release-notes-v${{ needs.package.outputs.version }}.md \
            --prerelease
