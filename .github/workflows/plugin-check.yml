name: WordPress Plugin Check & runtime
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
jobs:
  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Official Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ./plugin/llms-txt-composer
          slug: llms-txt-composer
      - name: Runtime route and rendering smoke test
        shell: bash
        run: |
          set -euo pipefail
          wp-env run cli wp option update permalink_structure '/%postname%/'
          wp-env run cli wp rewrite flush
          wp-env run cli wp eval 'if (!class_exists("Amino_LLMS")) { WP_CLI::error("Plugin was not activated"); } if (!Amino_LLMS::valid_document(Amino_LLMS::render())) { WP_CLI::error("Invalid Markdown"); } WP_CLI::success("LLMs.txt Composer renders on WordPress");'
          curl --fail --silent --show-error --retry 4 --retry-delay 2 -D /tmp/amino-headers.txt http://localhost:8880/llms.txt -o /tmp/amino-llms.txt
          echo "--- Response headers ---"
          cat /tmp/amino-headers.txt
          echo "--- Response body (first 1500 bytes) ---"
          head -c 1500 /tmp/amino-llms.txt
          echo
          grep -qi 'content-type: text/plain' /tmp/amino-headers.txt
          grep -q '^# ' /tmp/amino-llms.txt
          grep -q '^## Main Pages' /tmp/amino-llms.txt
          # Assert the public HTTP contract, not just PHP rendering.
          grep -Eq '^HTTP/[0-9.]+ 200' /tmp/amino-headers.txt
          grep -qi '^x-content-type-options: nosniff' /tmp/amino-headers.txt
          ! grep -qi '^content-type: text/html' /tmp/amino-headers.txt
          # Invalid manual configuration must fail closed, never serve an empty document.
          wp-env run cli wp eval '$s = Amino_LLMS::settings(); $s["mode"] = "manual"; $s["manual_markdown"] = "Invalid document without Markdown heading"; update_option("llms_txt_composer_settings", $s, false); Amino_LLMS::invalidate();'
          curl --silent --show-error -D /tmp/amino-invalid-headers.txt http://localhost:8880/llms.txt -o /tmp/amino-invalid.txt
          grep -Eq '^HTTP/[0-9.]+ 503' /tmp/amino-invalid-headers.txt
          grep -qi '^content-type: text/plain' /tmp/amino-invalid-headers.txt
          grep -qx 'llms.txt is not configured yet.' /tmp/amino-invalid.txt
          echo "HTTP success headers and invalid-document fail-closed contract passed."
          # Test the actual public endpoint in all three modes.
          wp-env run cli wp eval '$s = Amino_LLMS::settings(); $s["mode"] = "manual"; $s["manual_markdown"] = "# Manual Smoke\n\n## Resources\n- [Home](https://example.org/)"; update_option("llms_txt_composer_settings", $s, false); Amino_LLMS::invalidate();'
          curl -fsS http://localhost:8880/llms.txt -o /tmp/amino-manual.txt
          grep -q '^# Manual Smoke' /tmp/amino-manual.txt
          grep -q '^## Resources' /tmp/amino-manual.txt
          wp-env run cli wp eval '$s = Amino_LLMS::settings(); $s["mode"] = "automatic"; update_option("llms_txt_composer_settings", $s, false); Amino_LLMS::invalidate();'
          curl -fsS http://localhost:8880/llms.txt -o /tmp/amino-automatic.txt
          grep -q '^## Main Pages' /tmp/amino-automatic.txt
          ! grep -q '^# Manual Smoke' /tmp/amino-automatic.txt
          wp-env run cli wp eval '$s = Amino_LLMS::settings(); $s["mode"] = "hybrid"; $s["introduction"] = "A carefully written editorial introduction."; update_option("llms_txt_composer_settings", $s, false); Amino_LLMS::invalidate();'
          curl -fsS http://localhost:8880/llms.txt -o /tmp/amino-hybrid.txt
          grep -q 'editorial introduction' /tmp/amino-hybrid.txt
          wp-env run cli wp eval 'if (file_exists(ABSPATH . "llms.txt")) { WP_CLI::error("Unexpected physical llms.txt was created"); } WP_CLI::success("No root-file writes");'
          echo "All virtual delivery modes passed HTTP smoke tests."
          # Exercise the actual admin-post save and rollback handlers using a real admin user and nonce.
          wp-env run cli wp eval 'wp_set_current_user(1); $_REQUEST["_wpnonce"] = wp_create_nonce("amino_llms_save"); $_POST["amino_llms"] = ["mode" => "manual", "site_name" => "Admin QA", "summary" => "", "introduction" => "", "manual_markdown" => "# Admin Save\n\n## Links\n- [Encoded](https://example.org/my%20file.pdf)", "post_types" => ["post"], "items_per_type" => 3, "highlight_ids" => ""]; Amino_LLMS::save_settings();'
          wp-env run cli wp eval '$s = Amino_LLMS::settings(); if ($s["mode"] !== "manual" || !str_contains($s["manual_markdown"], "my%20file.pdf")) { WP_CLI::error("Admin form save failed to preserve Markdown URL"); } WP_CLI::success("Admin save confirmed");'
          curl -fsS http://localhost:8880/llms.txt -o /tmp/amino-admin-save.txt
          grep -q '^# Admin Save' /tmp/amino-admin-save.txt
          grep -q 'my%20file.pdf' /tmp/amino-admin-save.txt
          wp-env run cli wp eval 'wp_set_current_user(1); $_REQUEST["_wpnonce"] = wp_create_nonce("amino_llms_restore"); Amino_LLMS::restore_settings();'
          wp-env run cli wp eval '$s = Amino_LLMS::settings(); if ($s["mode"] !== "hybrid") { WP_CLI::error("Admin rollback did not restore hybrid settings"); } WP_CLI::success("Admin restore confirmed");'
          curl -fsS http://localhost:8880/llms.txt -o /tmp/amino-admin-restore.txt
          grep -q 'editorial introduction' /tmp/amino-admin-restore.txt
          echo "Real admin save/restore handlers passed."
          # Smoke-test the actual admin markup for the progressive-enhancement mode UI.
          wp-env run cli wp eval 'wp_set_current_user(1); ob_start(); Amino_LLMS::admin_page(); $html = ob_get_clean(); foreach (["data-mode-show=\\\"automatic hybrid\\\"", "data-mode-show=\\\"manual\\\"", "data-mode-show=\\\"hybrid\\\""] as $marker) { if (!str_contains($html, stripcslashes($marker))) { WP_CLI::error("Missing editor mode group: " . $marker); } } WP_CLI::success("Mode-specific admin groups are present for accessible JS enhancement");'
          # Verify the new featured search against an actual WordPress database.
          wp-env run cli wp eval '$id = wp_insert_post(["post_title" => "Composer Featured Lookup Fixture", "post_type" => "post", "post_status" => "publish"], true); if (is_wp_error($id) || !$id) { WP_CLI::error("Could not seed public search fixture"); } $rows = Amino_LLMS::find_featured_posts("Composer Featured Lookup Fixture"); if (count($rows) !== 1 || $rows[0]["id"] !== $id) { WP_CLI::error("Published content search failed"); } update_post_meta($id, "_yoast_wpseo_meta-robots-noindex", "1"); if (Amino_LLMS::find_featured_posts("Composer Featured Lookup Fixture")) { WP_CLI::error("Noindex content leaked into search"); } delete_post_meta($id, "_yoast_wpseo_meta-robots-noindex"); wp_update_post(["ID" => $id, "post_status" => "private"]); if (Amino_LLMS::find_featured_posts("Composer Featured Lookup Fixture")) { WP_CLI::error("Private content leaked into search"); } wp_delete_post($id, true); WP_CLI::success("Real WordPress featured search and privacy verified");'

